[package]
name = "quality-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Shared by crapper, mutator and dryer (ADR 0012): source selection, the
# tree-sitter language table, coverage reports and runners, atomic writes.
[dependencies]
# tree-sitter-language-pack 1.21.0 sources/language_definitions.json pins
# Python at this untagged upstream revision and regenerates its parser. The
# generated C, rather than the released 0.25.0 crate, has the oracle's 275
# node kinds and 2788 parse states (its ABI 15 versus the oracle's regenerated
# ABI 14). See scripts/check-grammar-parity.py.
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = { git = "https://github.com/tree-sitter/tree-sitter-python", rev = "26855eabccb19c6abf499fbc5b8dc7cc9ab8bc64" }
tree-sitter-typescript = "=0.23.2"
tree-sitter-lua = "=0.2.0"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
