[package]
name = "viewer-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary.
autotests = false

# The viewer session (#17): no companion, no egui, eframe or winit.
[dependencies]
edn = { path = "../edn" }
scene = { path = "../scene" }
frame = { path = "../frame" }
serde_json = "1"

[lints.rust]
# cargo llvm-cov sets cfg(coverage) for the quality refresh.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[[test]]
name = "integration"
path = "tests/main.rs"
