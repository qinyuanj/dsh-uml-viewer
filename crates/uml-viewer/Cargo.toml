[package]
name = "uml-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary.
autotests = false

[[bin]]
name = "uml-viewer"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
crapper = { path = "../crapper" }
dryer = { path = "../dryer" }
frame = { path = "../frame" }
ir = { path = "../ir" }
mutator = { path = "../mutator" }
quality-dispatch = { path = "../quality-dispatch" }
scene = { path = "../scene" }
viewer = { path = "../viewer" }
viewer-session = { path = "../viewer-session" }

[dev-dependencies]
edn = { path = "../edn" }
serde_json = "1"
