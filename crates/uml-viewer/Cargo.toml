[package]
name = "uml-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary.
autotests = false

[[bin]]
name = "uml-viewer"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
companion = { path = "../companion" }
crapper = { path = "../crapper" }
dryer = { path = "../dryer" }
frame = { path = "../frame" }
ir = { path = "../ir" }
scene = { path = "../scene" }
viewer = { path = "../viewer" }

[dev-dependencies]
edn = { path = "../edn" }
