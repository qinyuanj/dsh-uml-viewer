[package]
name = "uml-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the hermetic test binary; tests/toolchain_contract.rs holds
# the opt-in external toolchain contract suite.
autotests = false

[features]
toolchain-contract = []

[[bin]]
name = "uml-viewer"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "toolchain_contract"
path = "tests/toolchain_contract.rs"
required-features = ["toolchain-contract"]

[dependencies]
crapper = { path = "../crapper" }
dryer = { path = "../dryer" }
frame = { path = "../frame" }
ir = { path = "../ir" }
mutator = { path = "../mutator" }
quality-dispatch = { path = "../quality-dispatch" }
scene = { path = "../scene" }
viewer-session = { path = "../viewer-session" }

[dev-dependencies]
edn = { path = "../edn" }
serde_json = "1"
