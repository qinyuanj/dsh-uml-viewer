[package]
name = "viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary.
autotests = false

[dependencies]
edn = { path = "../edn" }
scene = { path = "../scene" }
frame = { path = "../frame" }
viewer-session = { path = "../viewer-session" }
companion = { path = "../companion" }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "system_fonts",
] }
egui = { version = "0.37" }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", features = ["x11", "wayland"] }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "integration"
path = "tests/main.rs"
