[package]
name = "frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# tests/main.rs is the one test binary.
autotests = false

# No window or GUI stack: the window-free viewer model (#16).
[dependencies]
edn = { path = "../edn" }
scene = { path = "../scene" }
serde_json = "1"

[lints.rust]
# cargo llvm-cov sets cfg(coverage) for the quality refresh.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[[test]]
name = "integration"
path = "tests/main.rs"
