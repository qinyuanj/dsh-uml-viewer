# One workspace, one binary (#134). Library crates hold the deep modules
# (edn now; ir, scene, companion, viewer later) and the `uml-viewer` binary
# only dispatches subcommands to them.
[workspace]
resolver = "3"
members = ["crates/*"]
# Analysed fixture projects are not part of the build.
exclude = ["rust-fixture"]

[workspace.package]
# Authoritative release version; npm manifests are checked/synced by scripts/version.mjs.
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Keep local checking small across the workspace and its worktrees.
# Debug symbols and incremental object caches are deliberately disabled.
[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
