# The guardrails on every push and pull request: formatting, clippy with
# warnings denied, and scripts/check.py (the static source rules, cargo build
# --release and cargo test --workspace). The old public entry and its Python
# suites were deleted with the companion (#18), so nothing here is skipped by
# platform. Linux and native Windows also accept the maintainer's binary
# quality crap -> differential mutate -> ir refresh; panel Playwright is panel-e2e.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The repository's .cargo/config.toml caps local Cargo jobs at 2 for the
# maintainer's resource policy (D17). CI's own runners are not capped by it:
# this overrides build.jobs for every job here.
env:
  CARGO_BUILD_JOBS: 4

jobs:
  typescript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cargo and npm release version consistency
        run: pnpm version:check
      - name: Package assembly contract
        run: pnpm test:package
      - name: Strict TypeScript type check
        run: pnpm typecheck
      - name: TypeScript unit and Cordis seam tests
        run: pnpm test
      - name: Build the host plugin
        run: pnpm build
      - name: Validate dsh-std manifest and resources
        run: pnpm validate:manifest

  panel-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # The lane rejects the live GUI; these only point it at CI-owned files.
      DSH_CLI: ${{ github.workspace }}\.scratch\dsh-cli\node_modules\.bin\dsh.cmd
      UML_VIEWER_BIN: ${{ github.workspace }}\target\debug\uml-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: Build the plugin
        run: pnpm build
      - name: Build the resident binary
        run: cargo build --locked -p uml-viewer
      - name: Isolated DSH CLI
        run: npm install --prefix .scratch/dsh-cli --no-save @deepseek-ai/dsh@0.2.2-rc.1
      - name: Scratch Chromium
        run: pnpm e2e:install
      - name: Assemble packages for install and removal acceptance
        id: panel-packages
        run: node scripts/package.mjs --binary "$env:UML_VIEWER_BIN" --out "${{ github.workspace }}/.scratch/panel-packages"
      - name: Read packaged acceptance version
        id: panel-version
        run: node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync('.scratch/panel-packages/package-report.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + report.version + '\n')"
      - name: Real panel acceptance
        run: pnpm test:e2e
      - name: Packaged install display and removal acceptance
        if: ${{ !cancelled() && steps.panel-packages.outcome == 'success' && steps.panel-version.outcome == 'success' }}
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test package.spec.mjs --output ../../.scratch/e2e/package-results
      - name: Preserve panel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e-diagnostics
          # Explicit files only: never upload scratch profiles, caches or binaries.
          include-hidden-files: true
          path: |
            .scratch/e2e/results/**
            .scratch/e2e/package-results/**
            .scratch/e2e/run-*/package-preservation.json
            .scratch/e2e/evidence/**
            .scratch/e2e/diagnostics/**
            .scratch/e2e/run-*/mock-requests/*.json
            .scratch/e2e/run-*/oracle-*.frame.json
            .scratch/e2e/run-*/*-failure.txt
            .scratch/e2e/run-*/*-failure.png
          if-no-files-found: warn
          retention-days: 7

  windows-crap:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: CRAP native Windows tests
        run: cargo test -p crapper --locked
      - name: CRAP integration tests and goldens
        run: cargo test -p uml-viewer --test integration crap_ --locked

  # Native Windows mutation (#10): per-command project copies over the shared
  # kill-on-close Job Object, with real cargo test inside the copies.
  windows-mutate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # A missing toolchain must fail here, never skip.
      MUTATOR_REQUIRE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      # cargo llvm-cov needs llvm-profdata; the default-coverage golden uses it.
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: LLVM tools for cargo-llvm-cov
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov for the coverage goldens
        run: cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
      - name: Mutation native Windows tests
        run: cargo test -p mutator --locked
      - name: Mutation integration tests
        run: cargo test -p uml-viewer --test integration mutate --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Reuse the integration tests' debug artifacts; release would compile twice.
      - name: Build the Windows refresh binary
        run: cargo build --locked -p uml-viewer
      # One binary call per step, including validation of valid exits 2/3.
      # Never upload .metrics or the temporary records/IR from this runner.
      - name: Maintainer refresh - CRAP (Windows)
        timeout-minutes: 21
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe crap
      - name: Maintainer refresh - differential mutation (Windows)
        timeout-minutes: 6
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe mutate
      - name: Maintainer refresh - gated IR (Windows)
        timeout-minutes: 1
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe ir

  # macOS (#10): mutate refuses with exit 1 before any command; crap and dry
  # are unaffected. No mutation isolation is claimed on this platform.
  macos-quality:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: mutate refuses, crap and dry work
        run: |
          cargo test -p mutator --locked
          cargo test -p uml-viewer --test integration mutate --locked
          cargo test -p uml-viewer --test integration --locked -- crap_goldens dry_
          cargo test -p dryer -p crapper --locked

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          # The oracle snapshots in fixtures/crap/live were generated with
          # Node 24 (fixtures/crap/live/README.md); type stripping needs 22.6+.
          node-version: '24'
      # The measured projects' own test tools, not a Python analysis runtime.
      - name: Python and TypeScript fixture toolchains
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 liblua5.4-dev luarocks
          sudo luarocks --lua-version=5.4 install busted
          sudo luarocks --lua-version=5.4 install luacov
          sudo luarocks --lua-version=5.4 install cluacov 1.0.0-1
          sudo luarocks --lua-version=5.4 install luacov-reporter-lcov

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clojure CLI
        run: |
          # Pinned release: the `latest` tag moves under us, and its installer
          # verifies the clojure-tools tarball checksum. The release asset is
          # immutable, so this script hash is stable.
          curl -fsSL -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          echo "5ae63b082ed33bf4c29bf1a8317c5c15249d1bc753676b2f5177fb3804ad6f77  linux-install.sh" \
            | sha256sum -c -
          sudo bash linux-install.sh
          # `clj` is a shell wrapper around `rlwrap`; without it every
          # invocation exits 1 before the JVM starts.
          sudo apt-get install -y --no-install-recommends rlwrap

      - name: Java fixture JaCoCo report
        run: mvn -q -f fixtures/crap/java/pom.xml test
      - name: Clojure fixture Cloverage report
        run: clj -M:cov --lcov
        working-directory: fixtures/crap/clojure

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Real Python, TypeScript and Lua coverage integration tests
        env:
          CRAPPER_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p uml-viewer --test integration crap_languages -- --test-threads=1

      # Configure only this disposable runner; keep mutation tests unprivileged.
      - name: Linux mutation namespace preflight
        shell: bash
        run: |
          set -euo pipefail
          uname -sr
          unshare --version
          for key in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            if [[ -e "/proc/sys/${key//.//}" ]]; then
              sysctl "$key"
            else
              echo "$key: unavailable"
            fi
          done
          # Match crates/mutator/src/isolation.rs, including UID mapping and PID lifecycle.
          probe() {
            unshare --user --map-root-user --mount --pid --fork --kill-child -- \
              /bin/sh -c 'test "$(id -u)" -eq 0 && mount --make-rprivate /'
          }
          if ! probe; then
            echo 'Namespace probe failed; checking disposable runner policy.'
            if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux ]]; then
              echo '::error::Refusing to change namespace policy outside a GitHub-hosted Linux runner.'
              exit 1
            fi
            if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && \
               [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" == 1 ]]; then
              sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]] && \
               [[ "$(sysctl -n kernel.unprivileged_userns_clone)" == 0 ]]; then
              sudo -n sysctl -w kernel.unprivileged_userns_clone=1
            fi
            if ! probe; then
              echo '::error::Linux mutation namespaces remain blocked; see docs/mutation-linux.md.'
              exit 1
            fi
          fi
          echo 'Linux mutation namespace preflight passed.'

      # Mutation needs the project's own virtualenv, never a global install.
      - name: Isolated Python mutation virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/mutator-venv"
          "$RUNNER_TEMP/mutator-venv/bin/python" -m pip install coverage pytest
      - name: Python and TypeScript mutation tests
        env:
          MUTATOR_TEST_PYTHON_VENV: ${{ runner.temp }}/mutator-venv
          MUTATOR_REQUIRE_TOOLCHAINS: '1'
        run: |
          cargo test -p mutator --locked --test python_ts --test python_ts_sites -- --test-threads=1
          cargo test -p uml-viewer --test integration mutate:: --locked -- --test-threads=1
          cargo test -p uml-viewer --test integration quality_selection:: --locked -- --test-threads=1

      # The full Rust mutation suite exercises default coverage, not only custom commands.
      - name: LLVM tools for Linux coverage goldens
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov for Linux coverage goldens
        run: cargo install cargo-llvm-cov --locked
      - name: Verify Linux coverage toolchain
        run: cargo llvm-cov --version
      - name: scripts/check.py (source rules + cargo test --workspace --locked)
        run: python3 -I scripts/check.py
      # scripts/check.py already built this release binary. The disposable
      # checkout may gain snapshots; records and IR stay under RUNNER_TEMP.
      - name: Maintainer refresh - CRAP (Linux)
        timeout-minutes: 21
        run: python3 -I scripts/ci-refresh.py target/release/uml-viewer crap
      - name: Maintainer refresh - differential mutation (Linux)
        timeout-minutes: 6
        run: python3 -I scripts/ci-refresh.py target/release/uml-viewer mutate
      - name: Maintainer refresh - gated IR (Linux)
        timeout-minutes: 1
        run: python3 -I scripts/ci-refresh.py target/release/uml-viewer ir
