# The guardrails on every push and pull request: formatting, clippy with
# warnings denied, and scripts/check.py (cargo build --release, cargo test
# --workspace and the static source rules). The runner is native Linux, which
# the public entry refuses (ADR 0007), so check.py lists the entry suites as
# skipped here; they run on WSL2, macOS and native Windows. The quality gate
# (./uml crap / mutate) and real-window drivers stay manual.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-crap:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: CRAP native Windows tests
        run: |
          cargo test -p crapper --locked
          cargo test -p uml-viewer --test integration crap_ --locked
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # The viewer dlopens these at run time (no -dev headers to build).
      - name: Viewer runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libegl1 libgl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            libfontconfig1 fonts-dejavu-core fonts-noto-cjk

      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clojure CLI
        run: |
          # Pinned release: the `latest` tag moves under us, and its installer
          # verifies the clojure-tools tarball checksum. The release asset is
          # immutable, so this script hash is stable.
          curl -fsSL -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          echo "5ae63b082ed33bf4c29bf1a8317c5c15249d1bc753676b2f5177fb3804ad6f77  linux-install.sh" \
            | sha256sum -c -
          sudo bash linux-install.sh
          # `clj` is a shell wrapper around `rlwrap`; without it every
          # invocation exits 1 before the JVM starts.
          sudo apt-get install -y --no-install-recommends rlwrap

      - name: Java fixture JaCoCo report
        run: mvn -q -f fixtures/crap/java/pom.xml test
      - name: Clojure fixture Cloverage report
        run: clj -M:cov --lcov
        working-directory: fixtures/crap/clojure

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: scripts/check.py (cargo test --workspace --locked + Python suites)
        run: python3 -I scripts/check.py
