name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # A nightly full matrix catches toolchain and upstream drift that
    # presubmit path routing would otherwise skip.
    - cron: '17 19 * * *'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4

concurrency:
  # A pull request keeps only its newest run. Main, a release tag and the nightly
  # run never cancel each other, so the event name is part of the group.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Tier 0: one ubuntu runner classifies the diff using the live Cargo/pnpm
    # dependency graph, so a documentation-only change never takes a Windows runner.
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
      full: ${{ steps.route.outputs.full }}
      fast: ${{ steps.route.outputs.fast }}
      typescript: ${{ steps.route.outputs.typescript }}
      rust_hermetic: ${{ steps.route.outputs.rust_hermetic }}
      panel_e2e: ${{ steps.route.outputs.panel_e2e }}
      upgrade_e2e: ${{ steps.route.outputs.upgrade_e2e }}
      mutate_refresh: ${{ steps.route.outputs.mutate_refresh }}
      toolchain_crapper: ${{ steps.route.outputs.toolchain_crapper }}
      toolchain_mutator: ${{ steps.route.outputs.toolchain_mutator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the changed files
        id: route
        env:
          UML_CI_EVENT: ${{ github.event_name }}
          UML_CI_REF: ${{ github.ref }}
          UML_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UML_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I scripts/ci-changes.py

  windows-fast:
    # Tier 1: formatting, lint (including toolchain-contract feature targets),
    # and the fast Python guard suites.
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub's default pwsh shell exits with the LAST command's code only, so
      # a multiline step can hide a failed first native command: one per step.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Fast repository guards
        run: python -I scripts/check.py --fast

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cargo and npm release version consistency
        run: pnpm version:check
      - name: Package assembly contract
        run: pnpm test:package
      - name: Strict TypeScript type check
        run: pnpm typecheck
      - name: TypeScript unit and Cordis seam tests
        run: pnpm test
      - name: Build the host plugin
        run: pnpm build
      - name: Validate dsh-std manifest and resources
        run: pnpm validate:manifest

  windows-hermetic:
    # Tier 2 (Hermetic Rust): consolidated release build + full hermetic
    # workspace test suite via cargo-nextest + doctests, with zero external
    # Go/Java/Clojure/Lua toolchain installation.
    needs: changes
    if: needs.changes.outputs.rust_hermetic == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - name: cargo-nextest for the hermetic workspace suite
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: scripts/check.py (source rules + release build + hermetic suite)
        run: python -I scripts/check.py

  panel-e2e:
    needs: changes
    if: needs.changes.outputs.panel_e2e == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      DSH_CLI: ${{ github.workspace }}\.scratch\dsh-cli\node_modules\.bin\dsh.cmd
      UML_VIEWER_BIN: ${{ github.workspace }}\target\debug\uml-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - run: pnpm install --frozen-lockfile
      - name: Build the plugin
        run: pnpm build
      - name: Build the resident binary
        run: cargo build --locked -p uml-viewer
      - name: Isolated DSH CLI
        run: npm install --prefix .scratch/dsh-cli --no-save @deepseek-ai/dsh@0.2.2-rc.1
      - name: Scratch Chromium
        run: pnpm e2e:install
      - name: Assemble packages for install and removal acceptance
        id: panel-packages
        run: node scripts/package.mjs --binary "$env:UML_VIEWER_BIN" --out "${{ github.workspace }}/.scratch/panel-packages"
      - name: Read packaged acceptance version
        id: panel-version
        run: node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync('.scratch/panel-packages/package-report.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + report.version + '\n')"
      - name: Real panel acceptance
        run: pnpm test:e2e
      - name: Packaged install display and removal acceptance
        id: packaged-acceptance
        if: ${{ !cancelled() && steps.panel-packages.outcome == 'success' && steps.panel-version.outcome == 'success' }}
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test package.spec.mjs --output ../../.scratch/e2e/package-results
      - name: Build and assemble disposable next-patch upgrade packages
        id: upgrade-packages
        if: ${{ !cancelled() && steps.packaged-acceptance.outcome == 'success' && needs.changes.outputs.upgrade_e2e == 'true' }}
        timeout-minutes: 12
        run: node scripts/ci-upgrade-package.mjs
      - name: Installed live upgrade acceptance
        if: ${{ !cancelled() && steps.upgrade-packages.outcome == 'success' && needs.changes.outputs.upgrade_e2e == 'true' }}
        timeout-minutes: 5
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_MAIN: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-${{ steps.upgrade-packages.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_PLATFORM: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-win32-x64-${{ steps.upgrade-packages.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test upgrade.spec.mjs --output ../../.scratch/e2e/upgrade-results
      - name: Preserve panel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e-diagnostics
          include-hidden-files: true
          path: |
            .scratch/e2e/results/**
            .scratch/e2e/package-results/**
            .scratch/e2e/upgrade-results/**
            .scratch/e2e/run-*/package-preservation.json
            .scratch/e2e/run-*/upgrade-acceptance.json
            .scratch/e2e/evidence/**
            .scratch/e2e/diagnostics/**
            .scratch/e2e/run-*/mock-requests/*.json
            .scratch/e2e/run-*/oracle-*.frame.json
            .scratch/e2e/run-*/*-failure.txt
            .scratch/e2e/run-*/*-failure.png
          if-no-files-found: warn
          retention-days: 7

  windows-mutate:
    # Tier 2 (Self-Hosting Quality Refresh): runs CRAP, differential mutation,
    # and gated IR over the hermetic suite. External 7-language contract tests
    # live in toolchain-crapper / toolchain-mutator and never inflate llvm-cov.
    needs: changes
    if: needs.changes.outputs.mutate_refresh == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      UML_REFRESH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch refresh base SHA
        shell: bash
        run: |
          if [[ "$UML_REFRESH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$UML_REFRESH_BASE_SHA"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - name: LLVM tools for cargo-llvm-cov
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov for self-hosting CRAP
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo-nextest for the fail-fast Rust suite
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Windows refresh binary
        run: cargo build --locked -p uml-viewer
      - name: Build the host package for quality collection
        run: pnpm build
      - name: Maintainer refresh - CRAP (Windows)
        timeout-minutes: 28
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe crap
      - name: Maintainer refresh - differential mutation (Windows)
        timeout-minutes: 6
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe mutate
      - name: Maintainer refresh - gated IR (Windows)
        timeout-minutes: 1
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe ir

  toolchain-crapper:
    # Tier 3 (Large Toolchain Contract - Coverage): runs once on direct touch
    # in Presubmit and always on non-docs main push / nightly. Uses nextest
    # test-groups instead of --test-threads=1 and never mutates fixtures/ in-tree.
    needs: changes
    if: needs.changes.outputs.toolchain_crapper == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      CRAPPER_REQUIRE_TOOLCHAINS: '1'
      MUTATOR_REQUIRE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - name: cargo-nextest for test-group throttled contracts
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python fixture toolchain
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven and Clojure fixture toolchain
        run: ./scripts/setup-windows-maven-clojure.ps1
      - name: External 7-language coverage and Lua mutation contracts
        run: cargo nextest run -p uml-viewer --features toolchain-contract --test toolchain_contract --locked

  toolchain-mutator:
    # Tier 3 (Large Toolchain Contract - Mutation): runs once on direct touch
    # in Presubmit and always on non-docs main push / nightly. Uses nextest
    # test-groups instead of --test-threads=1.
    needs: changes
    if: needs.changes.outputs.toolchain_mutator == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      MUTATOR_REQUIRE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust
      - name: cargo-nextest for test-group throttled contracts
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python fixture toolchain
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven and Clojure fixture toolchain
        run: ./scripts/setup-windows-maven-clojure.ps1
      - name: External 7-language mutation contracts
        run: cargo nextest run -p mutator --features toolchain-contract --test toolchain_contract --locked
      - name: Strict coverage reuse contracts with real Python and Node
        run: cargo nextest run -p mutator --test integration -E 'test(/^coverage_reuse::/)' --locked

  release-drift:
    name: npm registry, release tag and repository version agree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm, release tag and repository versions agree
        run: node scripts/release-drift.mjs

  ci-gate:
    # Single deterministic summary gate for GitHub branch protection (ADR 0020).
    # Succeeds when every triggered lane succeeded and skipped lanes were routed out.
    name: ci-gate
    needs:
      - changes
      - windows-fast
      - typescript
      - windows-hermetic
      - panel-e2e
      - windows-mutate
      - toolchain-crapper
      - toolchain-mutator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all triggered lanes passed
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS_JSON'])
          failed = []
          for name, info in sorted(results.items()):
              outcome = info.get('result')
              print(f'ci-gate: {name}={outcome}')
              if outcome not in ('success', 'skipped'):
                  failed.append(f'{name}:{outcome}')
          if failed:
              print('ci-gate: FAILED -> ' + ', '.join(failed), file=sys.stderr)
              sys.exit(1)
          print('ci-gate: PASS')
          PY

  post-submit-alert:
    # Stop-the-bleeding alert for main push / nightly regressions (ADR 0020):
    # opens or updates a single tracked regression issue with triage labels.
    name: post-submit regression alert
    needs:
      - ci-gate
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          TITLE="[CI] Post-submit / Nightly regression"
          BODY="Workflow \`ci\` failed on \`$EVENT_NAME\` (\`$HEAD_SHA\`).\n\nRun: $RUN_URL"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label "bug" --label "ci"
          fi
