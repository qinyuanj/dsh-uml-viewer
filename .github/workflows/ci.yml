name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # A nightly full matrix catches toolchain and upstream drift that the
    # path routing would otherwise never reach.
    - cron: '17 19 * * *'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4

concurrency:
  # A pull request keeps only its newest run. Main, a release tag and the nightly
  # run never cancel each other, so the event name is part of the group.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Tier 0 and Tier 3 live here: one ubuntu runner classifies the diff, so a
    # documentation-only change never takes a Windows runner.
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
      full: ${{ steps.route.outputs.full }}
      fast: ${{ steps.route.outputs.fast }}
      typescript: ${{ steps.route.outputs.typescript }}
      panel_e2e: ${{ steps.route.outputs.panel_e2e }}
      crap: ${{ steps.route.outputs.crap }}
      mutate: ${{ steps.route.outputs.mutate }}
      quality: ${{ steps.route.outputs.quality }}
      check: ${{ steps.route.outputs.check }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier diffs the merge base against the head commit.
          fetch-depth: 0
      - name: Classify the changed files
        id: route
        env:
          UML_CI_EVENT: ${{ github.event_name }}
          UML_CI_REF: ${{ github.ref }}
          UML_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UML_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I scripts/ci-changes.py

  windows-fast:
    # Tier 1: formatting, lint and the fast guard suites, split out of
    # windows-quality so style feedback never waits for the Java, Clojure, Go
    # and Lua fixture toolchains.
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub's default pwsh shell exits with the LAST command's code only, so
      # a multiline step can hide a failed first native command: one per step.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fast repository guards
        run: python -I scripts/check.py --fast

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cargo and npm release version consistency
        run: pnpm version:check
      - name: Package assembly contract
        run: pnpm test:package
      - name: Strict TypeScript type check
        run: pnpm typecheck
      - name: TypeScript unit and Cordis seam tests
        run: pnpm test
      - name: Build the host plugin
        run: pnpm build
      - name: Validate dsh-std manifest and resources
        run: pnpm validate:manifest

  panel-e2e:
    needs: changes
    if: needs.changes.outputs.panel_e2e == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      DSH_CLI: ${{ github.workspace }}\.scratch\dsh-cli\node_modules\.bin\dsh.cmd
      UML_VIEWER_BIN: ${{ github.workspace }}\target\debug\uml-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: Build the plugin
        run: pnpm build
      - name: Build the resident binary
        run: cargo build --locked -p uml-viewer
      - name: Isolated DSH CLI
        run: npm install --prefix .scratch/dsh-cli --no-save @deepseek-ai/dsh@0.2.2-rc.1
      - name: Scratch Chromium
        run: pnpm e2e:install
      - name: Assemble packages for install and removal acceptance
        id: panel-packages
        run: node scripts/package.mjs --binary "$env:UML_VIEWER_BIN" --out "${{ github.workspace }}/.scratch/panel-packages"
      - name: Read packaged acceptance version
        id: panel-version
        run: node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync('.scratch/panel-packages/package-report.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + report.version + '\n')"
      - name: Real panel acceptance
        run: pnpm test:e2e
      - name: Packaged install display and removal acceptance
        id: packaged-acceptance
        if: ${{ !cancelled() && steps.panel-packages.outcome == 'success' && steps.panel-version.outcome == 'success' }}
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test package.spec.mjs --output ../../.scratch/e2e/package-results
      - name: Build and assemble disposable next-patch upgrade packages
        id: upgrade-packages
        if: ${{ !cancelled() && steps.packaged-acceptance.outcome == 'success' }}
        timeout-minutes: 12
        run: node scripts/ci-upgrade-package.mjs
      - name: Installed live upgrade acceptance
        if: ${{ !cancelled() && steps.upgrade-packages.outcome == 'success' }}
        timeout-minutes: 5
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_MAIN: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-${{ steps.upgrade-packages.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_PLATFORM: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-win32-x64-${{ steps.upgrade-packages.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test upgrade.spec.mjs --output ../../.scratch/e2e/upgrade-results
      - name: Preserve panel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e-diagnostics
          include-hidden-files: true
          path: |
            .scratch/e2e/results/**
            .scratch/e2e/package-results/**
            .scratch/e2e/upgrade-results/**
            .scratch/e2e/run-*/package-preservation.json
            .scratch/e2e/run-*/upgrade-acceptance.json
            .scratch/e2e/evidence/**
            .scratch/e2e/diagnostics/**
            .scratch/e2e/run-*/mock-requests/*.json
            .scratch/e2e/run-*/oracle-*.frame.json
            .scratch/e2e/run-*/*-failure.txt
            .scratch/e2e/run-*/*-failure.png
          if-no-files-found: warn
          retention-days: 7

  windows-crap:
    needs: changes
    if: needs.changes.outputs.crap == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: CRAP native Windows tests
        run: cargo test -p crapper --locked
      - name: CRAP integration tests and goldens
        run: cargo test -p uml-viewer --test integration crap_ --locked

  windows-mutate:
    needs: changes
    if: needs.changes.outputs.mutate == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      MUTATOR_REQUIRE_TOOLCHAINS: '1'
      UML_REFRESH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch refresh base SHA
        shell: bash
        run: |
          if [[ "$UML_REFRESH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$UML_REFRESH_BASE_SHA"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - name: LLVM tools for cargo-llvm-cov
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov for the coverage goldens
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo-nextest for the fail-fast Rust suite
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python coverage fixture toolchain
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven and Clojure fixture toolchain
        run: ./scripts/setup-windows-maven-clojure.ps1
      # The mutator suite is not repeated here: windows-quality runs it with
      # REQUIRE_TOOLCHAINS=1, and the CRAP refresh below runs the whole workspace
      # suite under instrumentation, so a break still fails this job.
      - name: Mutation integration tests
        run: cargo test -p uml-viewer --test integration mutate --locked
      - name: Build the Windows refresh binary
        run: cargo build --locked -p uml-viewer
      - name: Build the host package for quality collection
        run: pnpm build
      - name: Maintainer refresh - CRAP (Windows)
        timeout-minutes: 21
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe crap
      - name: Maintainer refresh - differential mutation (Windows)
        timeout-minutes: 6
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe mutate
      - name: Maintainer refresh - gated IR (Windows)
        timeout-minutes: 1
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe ir

  windows-quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo-nextest for the fail-fast Rust suite
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          # The oracle snapshots in fixtures/crap/live were generated with
          # Node 24 (fixtures/crap/live/README.md); type stripping needs 22.6+.
          node-version: '24'
      - name: Python fixture toolchain
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Clojure's official Windows distribution is the ClojureTools PowerShell
      # module, not an executable: this script installs Maven and that module,
      # writes the `clj` launcher and puts both on PATH, so crapper, mutator and
      # the tests can start `clj` through cmd.exe.
      - name: Maven and Clojure fixture toolchain
        run: ./scripts/setup-windows-maven-clojure.ps1
      - name: Java fixture JaCoCo report
        run: mvn -q -f fixtures/crap/java/pom.xml test
      - name: Clojure fixture Cloverage report
        working-directory: fixtures/crap/clojure
        run: clj -M:cov --lcov
      # Formatting and lint moved to windows-fast, so this lane only builds
      # the fixture toolchains and runs the language integration suites.
      - name: Real Python, TypeScript and Lua coverage integration tests
        env:
          CRAPPER_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p uml-viewer --test integration crap_languages -- --test-threads=1
      - name: Go, Java and Clojure coverage runners execute, never skip
        env:
          CRAPPER_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p uml-viewer --test integration crap_runner_smoke --locked -- --test-threads=1
      - name: Go, Java and Clojure mutation cases execute, never skip
        env:
          MUTATOR_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p mutator --test go_java_clojure --locked -- --test-threads=1
      - name: Python and TypeScript mutation run on the one host
        env:
          MUTATOR_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p mutator --test python_ts --test python_ts_sites --locked -- --test-threads=1

  windows-check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    # check.py's release build and workspace suite used to trail windows-quality's
    # 13-minute strict lane; its own lane lets both start together.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The mutator's Rust cases run `cargo nextest` inside their fixtures.
      - name: cargo-nextest for the fail-fast Rust suite
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python fixture toolchain
        run: python -m pip install coverage pytest
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven and Clojure fixture toolchain
        run: ./scripts/setup-windows-maven-clojure.ps1
      - name: Java fixture JaCoCo report
        run: mvn -q -f fixtures/crap/java/pom.xml test
      - name: Clojure fixture Cloverage report
        working-directory: fixtures/crap/clojure
        run: clj -M:cov --lcov
      - name: scripts/check.py (source rules + release build + workspace suite)
        run: python -I scripts/check.py

  release-drift:
    name: npm registry, release tag and repository version agree
    # The publish job waits for a manual approval on the `release`
    # environment, so a green tag push does not mean the package reached npm.
    # This job compares npm dist-tags.latest, the repository version and the
    # newest v* tag, and tolerates the publication propagation window.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm, release tag and repository versions agree
        run: node scripts/release-drift.mjs
