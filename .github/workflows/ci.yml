# The guardrails on every push and pull request, on the one supported host
# (native Windows x64; ADR 0002): formatting, clippy with warnings denied,
# scripts/check.py (the static source rules, cargo build --release and cargo
# test --workspace) and the real Python/TypeScript/Lua coverage tests.
# windows-mutate also accepts the maintainer's binary quality
# crap -> differential mutate -> ir refresh, and no other host does; panel
# Playwright is panel-e2e.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The repository's .cargo/config.toml caps local Cargo jobs at 2 for the
# maintainer's resource policy (D17). CI's own runners are not capped by it:
# this overrides build.jobs for every job here.
env:
  CARGO_BUILD_JOBS: 4

jobs:
  typescript:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cargo and npm release version consistency
        run: pnpm version:check
      - name: Package assembly contract
        run: pnpm test:package
      - name: Strict TypeScript type check
        run: pnpm typecheck
      - name: TypeScript unit and Cordis seam tests
        run: pnpm test
      - name: Build the host plugin
        run: pnpm build
      - name: Validate dsh-std manifest and resources
        run: pnpm validate:manifest

  panel-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # The lane rejects the live GUI; these only point it at CI-owned files.
      DSH_CLI: ${{ github.workspace }}\.scratch\dsh-cli\node_modules\.bin\dsh.cmd
      UML_VIEWER_BIN: ${{ github.workspace }}\target\debug\uml-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: Build the plugin
        run: pnpm build
      - name: Build the resident binary
        run: cargo build --locked -p uml-viewer
      - name: Isolated DSH CLI
        run: npm install --prefix .scratch/dsh-cli --no-save @deepseek-ai/dsh@0.2.2-rc.1
      - name: Scratch Chromium
        run: pnpm e2e:install
      - name: Assemble packages for install and removal acceptance
        id: panel-packages
        run: node scripts/package.mjs --binary "$env:UML_VIEWER_BIN" --out "${{ github.workspace }}/.scratch/panel-packages"
      - name: Read packaged acceptance version
        id: panel-version
        run: node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync('.scratch/panel-packages/package-report.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + report.version + '\n')"
      - name: Real panel acceptance
        run: pnpm test:e2e
      - name: Packaged install display and removal acceptance
        id: packaged-acceptance
        if: ${{ !cancelled() && steps.panel-packages.outcome == 'success' && steps.panel-version.outcome == 'success' }}
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test package.spec.mjs --output ../../.scratch/e2e/package-results
      # Run last: the disposable version build reuses target only after every
      # ordinary lane finished; the immutable release tarballs remain unchanged.
      - name: Build and assemble disposable next-patch upgrade packages
        id: upgrade-packages
        if: ${{ !cancelled() && steps.packaged-acceptance.outcome == 'success' }}
        timeout-minutes: 12
        run: node scripts/ci-upgrade-package.mjs
      - name: Installed live upgrade acceptance
        if: ${{ !cancelled() && steps.upgrade-packages.outcome == 'success' }}
        timeout-minutes: 5
        env:
          UML_VIEWER_PACKAGE_MAIN: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_PACKAGE_PLATFORM: ${{ github.workspace }}/.scratch/panel-packages/dsh-uml-viewer-win32-x64-${{ steps.panel-version.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_MAIN: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-${{ steps.upgrade-packages.outputs.version }}.tgz
          UML_VIEWER_UPGRADE_PLATFORM: ${{ github.workspace }}/.scratch/upgrade-packages/dsh-uml-viewer-win32-x64-${{ steps.upgrade-packages.outputs.version }}.tgz
        run: pnpm --filter @dsh-uml-viewer/e2e exec playwright test upgrade.spec.mjs --output ../../.scratch/e2e/upgrade-results
      - name: Preserve panel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e-diagnostics
          # Explicit files only: never upload scratch profiles, caches or binaries.
          include-hidden-files: true
          path: |
            .scratch/e2e/results/**
            .scratch/e2e/package-results/**
            .scratch/e2e/upgrade-results/**
            .scratch/e2e/run-*/package-preservation.json
            .scratch/e2e/run-*/upgrade-acceptance.json
            .scratch/e2e/evidence/**
            .scratch/e2e/diagnostics/**
            .scratch/e2e/run-*/mock-requests/*.json
            .scratch/e2e/run-*/oracle-*.frame.json
            .scratch/e2e/run-*/*-failure.txt
            .scratch/e2e/run-*/*-failure.png
          if-no-files-found: warn
          retention-days: 7

  windows-crap:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: CRAP native Windows tests
        run: cargo test -p crapper --locked
      - name: CRAP integration tests and goldens
        run: cargo test -p uml-viewer --test integration crap_ --locked

  # Native Windows mutation (#10): per-command project copies over the shared
  # kill-on-close Job Object, with real cargo test inside the copies.
  windows-mutate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # A missing toolchain must fail here, never skip.
      MUTATOR_REQUIRE_TOOLCHAINS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      # cargo llvm-cov needs llvm-profdata; the default-coverage golden uses it.
      # GitHub's default pwsh shell exits with the LAST command's code only, so a
      # multiline step can hide a failed first native command: one per step.
      - name: LLVM tools for cargo-llvm-cov
        run: rustup component add llvm-tools
      - name: cargo-llvm-cov for the coverage goldens
        run: cargo install cargo-llvm-cov --locked
      - uses: Swatinem/rust-cache@v2
      # The mutator's own Python coverage test needs coverage.py, and
      # MUTATOR_REQUIRE_TOOLCHAINS makes a missing toolchain a failure here, so
      # the tool is installed before the suite runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The metacharacter fixture's stub fakes only the coverage script's
      # pytest probe; its baseline really runs -m pytest, so pytest is a fixture
      # toolchain too.
      - name: Python coverage fixture toolchain
        run: python -m pip install coverage pytest
      # A Lua suite reports through Busted, LuaCov and cluacov 1.0.0, and the
      # mutation collector adds the LuaCov LCOV reporter. The pinned installer
      # proves all of them and exports PATH, LUA_PATH and LUA_CPATH to the later
      # steps; MUTATOR_REQUIRE_TOOLCHAINS above makes it missing a failure.
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      - name: Mutation native Windows tests
        run: cargo test -p mutator --locked
      - name: Mutation integration tests
        run: cargo test -p uml-viewer --test integration mutate --locked
      # Reuse the integration tests' debug artifacts; release would compile twice.
      - name: Build the Windows refresh binary
        run: cargo build --locked -p uml-viewer
      # One binary call per step, including validation of valid exits 2/3.
      # Never upload .metrics or the temporary records/IR from this runner.
      - name: Maintainer refresh - CRAP (Windows)
        timeout-minutes: 21
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe crap
      - name: Maintainer refresh - differential mutation (Windows)
        timeout-minutes: 6
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe mutate
      - name: Maintainer refresh - gated IR (Windows)
        timeout-minutes: 1
        run: python -I scripts/ci-refresh.py target/debug/uml-viewer.exe ir

  # The gates that used to live only in the deleted `linux` job, on the one
  # supported host: formatting, clippy with warnings denied, the real
  # Python/TypeScript/Lua coverage integration test, and scripts/check.py.
  # The Linux job pulled those fixture toolchains from apt; here Python 3.12
  # comes from the Python setup action, Node 24 from the Node setup action, and
  # Lua 5.4 from the repository's own Windows installer that windows-mutate
  # already runs.
  # The Linux job's Go 1.25.3, JDK 17/Maven and Clojure CLI installs are not
  # ported: they only let crap_runner_smoke's Go/Java/Clojure cases and
  # mutator's Go/Java/Clojure cases execute instead of skipping, their own
  # header names Linux/WSL as the acceptance platform
  # (crates/mutator/tests/go_java_clojure.rs), and Clojure's official Windows
  # CLI is the PowerShell module this repository wires up by hand
  # (docs/platform-acceptance.md). With no honest Windows install path in the
  # repository, those cases now SKIP loudly instead of passing unverified.
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          # The oracle snapshots in fixtures/crap/live were generated with
          # Node 24 (fixtures/crap/live/README.md); type stripping needs 22.6+.
          node-version: '24'
      # The measured projects' own test tools, not a Python analysis runtime.
      - name: Python fixture toolchain
        run: python -m pip install coverage pytest
      # A Lua suite reports through Busted, LuaCov and cluacov 1.0.0, and the
      # coverage collector adds the LuaCov LCOV reporter. The pinned installer
      # proves all of them and exports PATH, LUA_PATH and LUA_CPATH to the
      # later steps.
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows-lua.ps1
      # crap_languages probes the Debian interpreter name `lua5.4`
      # (crates/uml-viewer/tests/crap_languages.rs), while the installer lays
      # down `lua.exe`. The alias is a copy of that same interpreter in its
      # own directory, so it still finds lua54.dll and the rocks; without it
      # CRAPPER_REQUIRE_TOOLCHAINS=1 would fail the Lua cases, not run them.
      - name: Lua 5.4 under the name the coverage suite probes
        run: |
          $lua = (Get-Command lua -CommandType Application | Select-Object -First 1).Source
          $alias = Join-Path (Split-Path $lua -Parent) 'lua5.4.exe'
          Copy-Item $lua $alias -Force
          & $alias -e "assert(_VERSION == 'Lua 5.4'); pcall(require, 'luarocks.loader'); assert(require('cluacov.version') == '1.0.0'); require('busted.runner'); require('luacov.reporter.lcov')"
      # GitHub's default pwsh shell exits with the LAST command's code only, so
      # a multiline step can hide a failed first native command: one per step.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Real Python, TypeScript and Lua coverage integration tests
        env:
          CRAPPER_REQUIRE_TOOLCHAINS: '1'
        run: cargo test -p uml-viewer --test integration crap_languages -- --test-threads=1
      - name: scripts/check.py (source rules + cargo test --workspace --locked)
        run: python -I scripts/check.py
