# The guardrails on every push and pull request: formatting, clippy with
# warnings denied, and scripts/check.py (cargo build --release, cargo test
# --workspace and the static source rules). The runner is native Linux, which
# the public entry refuses (ADR 0007), so check.py lists the entry suites as
# skipped here; they run on WSL2, macOS and native Windows. The quality gate
# (./uml crap / mutate) and real-window drivers stay manual.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript type check
        run: pnpm typecheck
      - name: TypeScript unit and Cordis seam tests
        run: pnpm test
      - name: Build the host plugin
        run: pnpm build

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # The viewer dlopens these at run time (no -dev headers to build).
      - name: Viewer runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libegl1 libgl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            libfontconfig1 fonts-dejavu-core fonts-noto-cjk

      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: scripts/check.py (cargo test --workspace --locked + Python suites)
        run: python3 -I scripts/check.py
