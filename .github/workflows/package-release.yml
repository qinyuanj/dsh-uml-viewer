name: package-release

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  changes:
    # A pull request assembles the archives only when a build, packaging,
    # version, manifest or bundled-document input changed; a release tag always
    # does.
    name: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.route.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The classifier diffs the merge base against the head commit.
          fetch-depth: 0
      - name: Classify the changed files
        id: route
        env:
          UML_CI_EVENT: ${{ github.event_name }}
          UML_CI_REF: ${{ github.ref }}
          UML_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UML_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I scripts/ci-changes.py

  assemble:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: assemble (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            binary: target/release/uml-viewer.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cargo and npm release version consistency
        run: pnpm version:check
      - name: Package contract, stale-payload gate and release guards
        run: pnpm test:package
      # GitHub's default pwsh shell on Windows exits with the LAST command's code
      # only, so each native command keeps its own step on every runner.
      - name: Build the plugin
        run: pnpm build
      - name: Build the native release binary
        run: cargo build --release --locked -p uml-viewer
      - name: Assemble the main and the current-platform archives
        shell: bash
        run: node scripts/package.mjs --binary "$GITHUB_WORKSPACE/${{ matrix.binary }}" --out "$RUNNER_TEMP/packages"
      - name: Stage the release archives
        shell: bash
        env:
          MAIN_RUNNER: ${{ matrix.platform == 'win32-x64' }}
        run: |
          set -euo pipefail
          arguments=(--package-dir "$RUNNER_TEMP/packages" --platform "${{ matrix.platform }}" --upload-dir "$RUNNER_TEMP/upload")
          if [ "$MAIN_RUNNER" = "true" ]; then
            node scripts/release.mjs stage "${arguments[@]}" --main
          else
            node scripts/release.mjs stage "${arguments[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.platform }}
          path: ${{ runner.temp }}/upload
          if-no-files-found: error
          retention-days: 7

  inventory:
    name: inventory and offline package dry run
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Cargo and npm release version consistency
        run: node scripts/version.mjs --check
      - name: Verify the release artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs verify --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/release-inventory.json"
          cat "$RUNNER_TEMP/release-inventory.json"
      - name: npm pack dry run
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs plan --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/publish-order.txt"
          planned=$(wc -l < "$RUNNER_TEMP/publish-order.txt")
          test "$planned" -eq 2
          while IFS= read -r archive; do
            npm pack "$archive" --dry-run --ignore-scripts
          done < "$RUNNER_TEMP/publish-order.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inventory
          path: ${{ runner.temp }}/release-inventory.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish ${{ github.ref_name }}
    needs: inventory
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'qinyuanj/dsh-uml-viewer'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/artifacts
      - name: The tag matches the Cargo workspace version
        run: node scripts/release.mjs check-tag "$GITHUB_REF_NAME"
      - name: Verify the release artifact inventory
        run: node scripts/release.mjs verify --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/release-inventory.json"
      - name: Dry-run the platform packages, then the main package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs plan --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/publish-order.txt"
          planned=$(wc -l < "$RUNNER_TEMP/publish-order.txt")
          test "$planned" -eq 2
          while IFS= read -r archive; do
            npm publish "$archive" --dry-run --access public --ignore-scripts --provenance=false
          done < "$RUNNER_TEMP/publish-order.txt"
      - name: Publish the platform packages, then the main package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs plan --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/publish-order.txt"
          planned=$(wc -l < "$RUNNER_TEMP/publish-order.txt")
          test "$planned" -eq 2
          while IFS= read -r archive; do
            npm publish "$archive" --provenance --access public --ignore-scripts
          done < "$RUNNER_TEMP/publish-order.txt"
